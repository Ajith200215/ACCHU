<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - For Acchu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Heart Gradient Definition -->
    <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
        <defs>
            <linearGradient id="heart-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="rgba(255, 255, 255, 0.9)" />
                <stop offset="30%" stop-color="rgba(255, 255, 255, 0.4)" />
                <stop offset="100%" stop-color="rgba(255, 138, 162, 0.6)" />
            </linearGradient>
        </defs>
    </svg>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="blob blob-5"></div>
    </div>

    <!-- Floating Glossy Hearts -->
    <div class="floating-hearts">
        <svg class="glossy-heart" style="--delay: 0s; left: 10%; width: 50px;" viewBox="0 0 100 100">
            <path d="M50 90C50 90 10 60 10 30C10 15 25 10 35 20C45 30 50 40 50 40C50 40 55 30 65 20C75 10 90 15 90 30C90 60 50 90 50 90Z" />
        </svg>
        <svg class="glossy-heart" style="--delay: 3s; left: 25%; width: 70px;" viewBox="0 0 100 100">
            <path d="M50 90C50 90 10 60 10 30C10 15 25 10 35 20C45 30 50 40 50 40C50 40 55 30 65 20C75 10 90 15 90 30C90 60 50 90 50 90Z" />
        </svg>
        <svg class="glossy-heart" style="--delay: 6s; left: 50%; width: 40px;" viewBox="0 0 100 100">
            <path d="M50 90C50 90 10 60 10 30C10 15 25 10 35 20C45 30 50 40 50 40C50 40 55 30 65 20C75 10 90 15 90 30C90 60 50 90 50 90Z" />
        </svg>
        <svg class="glossy-heart" style="--delay: 2s; left: 70%; width: 80px;" viewBox="0 0 100 100">
            <path d="M50 90C50 90 10 60 10 30C10 15 25 10 35 20C45 30 50 40 50 40C50 40 55 30 65 20C75 10 90 15 90 30C90 60 50 90 50 90Z" />
        </svg>
        <svg class="glossy-heart" style="--delay: 5s; left: 85%; width: 55px;" viewBox="0 0 100 100">
            <path d="M50 90C50 90 10 60 10 30C10 15 25 10 35 20C45 30 50 40 50 40C50 40 55 30 65 20C75 10 90 15 90 30C90 60 50 90 50 90Z" />
        </svg>
    </div>

    <main class="glass-container login-container">
        <h2>WELCOME MY LOVE 💕</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="username">Tallguy Date of Birth</label>
                <input type="text" id="username" placeholder="DDMMYYYY" maxlength="8" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="password">Bunny Kutty Date of Birth</label>
                <input type="password" id="password" placeholder="DDMMYYYY" maxlength="8" autocomplete="off">
            </div>
            <p class="hint">Credential in format of DDMMYYYY without any symbol</p>
            <p id="error-message" class="error-msg"></p>
            <button type="submit" class="submit-btn">Enter</button>
        </form>
    </main>

    <script src="login.js"></script>
</body>
</html>
